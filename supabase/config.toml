# Supabase local config for Redex Academy.
#
# Schema + RLS land in F2 (`academy`) and F2a (`workos`). The remote project is
# already provisioned (ref in .env.local / Supabase MCP) with the academy schema +
# seed applied live — `supabase link --project-ref <PROJECT_REF>`. F2 wires the
# authored migration files into supabase/migrations/ and appends "academy" to
# [api].schemas / extra_search_path below; F2 must NOT re-apply to a fresh remote
# or rewrite the DDL (see goals/F2_DRY_RUN.md).
project_id = "redex-academy"

[api]
enabled = true
port = 54321
# F2 added "academy"; F2a added "workos".
schemas = ["public", "graphql_public", "academy", "workos"]
extra_search_path = ["public", "extensions", "academy", "workos"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# 17, not 16: `supabase gen types` (and the rest of the CLI) PARSES this file on
# startup whenever run from the project dir, and rejects major_version = 16 as
# "Invalid db.major_version" — Supabase's local stack ships supabase/postgres for
# majors 15 and 17, not 16. 17 is the CLI default. (The bare-Postgres CI invariant
# jobs use the official `postgres:16` image via psql and never read this value.)
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
# Applied by `supabase db reset` / `supabase start` (local dev). CI applies the
# slice seed directly via psql in the `slice-seed` job (bare postgres:16, which
# never reads this file). Order matters: the catalog/badge seed (S1) seeds
# academy.orgs FIRST, before the dev identities (academy.users → orgs FK).
sql_paths = ["./seed/0001_mvp_slice_seed.sql", "./seed/0002_m2_content.sql", "./seed/20260529210648_dev_identities.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
# F3b: the magic-link / OAuth callback target must be allow-listed. Dev localhost +
# prod redex.education (set Site URL → https://redex.education in the dashboard for prod).
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
  "https://redex.education/auth/callback",
  "https://www.redex.education/auth/callback",
]
jwt_expiry = 3600
enable_signup = true

# F3b: email auth — magic link + 6-digit OTP as the PRIMARY path. Dev has no email
# confirmation gate and routes mail to Inbucket (http://localhost:54324); PROD flips
# enable_confirmations = true and provisions SMTP (Resend) — a release-gate dependency,
# never hardcode keys here.
[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

# F3: custom access-token hook — GoTrue calls academy.custom_access_token_hook on
# every token mint/refresh to inject org_id/roles/persona/evaluator_authorized/domains
# (the exact claim shape F2's RLS helpers read). The function is granted to
# supabase_auth_admin only (see the hook migration).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/academy/custom_access_token_hook"

# F3: external SSO for Redex staff + CCS-partner orgs. Secrets are NAMES ONLY here
# (env() interpolation) — real values live in the dashboard/Vault, never committed.
# Enable per the partner IdP once OIDC_* are configured.
[auth.external.google]
enabled = false # Google Workspace (OIDC) — flip true when configured
client_id = "env(OIDC_CLIENT_ID)"
secret = "env(OIDC_CLIENT_SECRET)"

[auth.external.azure]
enabled = false # Microsoft Entra (OIDC) — flip true when configured
client_id = "env(OIDC_CLIENT_ID)"
secret = "env(OIDC_CLIENT_SECRET)"
url = "env(OIDC_ISSUER_URL)"

# SAML SSO (managed partner orgs without their own OIDC) is enabled per-org via the
# Supabase Admin SSO API / dashboard; not a static config block here.

[edge_runtime]
enabled = true
# Edge Functions (Deno): finalize-signoff, issue-badge, xapi-bridge,
# grade-open-response, sim-feedback, recert-scan, sync — added in later goals.
