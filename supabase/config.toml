# Supabase local config for Redex Academy.
#
# Schema + RLS land in F2 (`academy`) and F2a (`workos`). The remote project is
# already provisioned (ref in .env.local / Supabase MCP) with the academy schema +
# seed applied live — `supabase link --project-ref <PROJECT_REF>`. F2 wires the
# authored migration files into supabase/migrations/ and appends "academy" to
# [api].schemas / extra_search_path below; F2 must NOT re-apply to a fresh remote
# or rewrite the DDL (see goals/F2_DRY_RUN.md).
project_id = "redex-academy"

[api]
enabled = true
port = 54321
# F2 added "academy"; F2a added "workos".
schemas = ["public", "graphql_public", "academy", "workos"]
extra_search_path = ["public", "extensions", "academy", "workos"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

# F3: custom access-token hook — GoTrue calls academy.custom_access_token_hook on
# every token mint/refresh to inject org_id/roles/persona/evaluator_authorized/domains
# (the exact claim shape F2's RLS helpers read). The function is granted to
# supabase_auth_admin only (see the hook migration).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/academy/custom_access_token_hook"

# F3: external SSO for Redex staff + CCS-partner orgs. Secrets are NAMES ONLY here
# (env() interpolation) — real values live in the dashboard/Vault, never committed.
# Enable per the partner IdP once OIDC_* are configured.
[auth.external.google]
enabled = false # Google Workspace (OIDC) — flip true when configured
client_id = "env(OIDC_CLIENT_ID)"
secret = "env(OIDC_CLIENT_SECRET)"

[auth.external.azure]
enabled = false # Microsoft Entra (OIDC) — flip true when configured
client_id = "env(OIDC_CLIENT_ID)"
secret = "env(OIDC_CLIENT_SECRET)"
url = "env(OIDC_ISSUER_URL)"

# SAML SSO (managed partner orgs without their own OIDC) is enabled per-org via the
# Supabase Admin SSO API / dashboard; not a static config block here.

[edge_runtime]
enabled = true
# Edge Functions (Deno): finalize-signoff, issue-badge, xapi-bridge,
# grade-open-response, sim-feedback, recert-scan, sync — added in later goals.
