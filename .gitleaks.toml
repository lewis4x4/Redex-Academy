title = "Redex Academy gitleaks config"

# Use gitleaks' built-in rule set, then add repo-specific allowlisting below.
[extend]
useDefault = true

[allowlist]
description = "Paths that legitimately contain no real secrets (names-only examples, lockfiles, generated artifacts)."
paths = [
  '''\.env\.example$''',
  '''pnpm-lock\.yaml$''',
  # Deno lockfile: SHA-256 integrity hashes of public deps. generic-api-key
  # false-positives on the high-entropy hash for modules whose URL ends in a
  # keyword (e.g. postgres/connection/auth.ts). Machine-generated, no real secrets.
  '''deno\.lock$''',
  '''packages/db-types/database\.types\.ts$''',
]
regexes = [
  # §5.4 rubric line_item_key values (academy.signoff_line_item_templates) are PUBLIC
  # curriculum keys, not API keys. generic-api-key false-positives on the high-entropy
  # ones (e.g. ac203.pte_mount_40_48in_5ft) because the surrounding JSON key is named
  # "*_key". They are seeded in plain SQL and authored in the sim specs — no secrets.
  '''^ac\d+\.[a-z0-9_.]+$''',
]
