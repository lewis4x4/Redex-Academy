name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ── Always-on gates ───────────────────────────────────────────────────────
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @redex/web exec playwright install --with-deps chromium
      # Builds the web app (turbo dependsOn) then runs Playwright. The offline
      # smoke (context.setOffline(true)) is added once F4 lands.
      - run: pnpm test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  a11y:
    name: a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @redex/web exec playwright install --with-deps chromium
      - run: pnpm test:a11y

  # ── DB-backed invariant regression (REAL @ F2; locked safety-veto/immutability/RLS/DAG)
  # Bare postgres:16 + apply supabase/migrations/* (the migration is bare-PG safe;
  # the auth.users FK is added only against Supabase — SCHEMA_NOTES §2), then run
  # the committed invariant test (safety-veto, immutability+void, RLS cross-tenant,
  # fixture gate, audit append-only, DAG cycle detection).
  db-invariants:
    name: db-invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redex
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/redex
    steps:
      - uses: actions/checkout@v4
      - name: Apply academy + workos migration(s)
        run: for f in supabase/migrations/*.sql; do psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Invariant tests (safety-veto / immutability / RLS / fixture / audit / DAG)
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/0001_invariants_test.sql
      - name: Cross-schema FK + workos RLS (F2a)
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/0003_workos_fk.sql
      - name: Auth-hook claim shape + RLS under minted claims (F3)
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/custom_access_token_hook_test.sql
      - name: New-user provisioning trigger + invitation tenant boundary (F3c)
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/f3c_provisioning_test.sql
      - name: Offline /sync idempotency — double-flush no-double-count + no-faked-pass (F4)
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/sync_idempotency_test.sql

  # ── Identity guard (REAL @ F3): no work_os_user_id / REDEX_WORKOS_* (one identity space).
  guard-no-workos:
    name: guard-no-workos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard:no-workos

  # ── RLS negative matrix (REAL @ F2): cross-org actor sees ZERO rows.
  rls-negative:
    name: rls-negative
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redex
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/redex
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply academy migration(s)
        run: for f in supabase/migrations/*.sql; do psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"; done
      - run: pnpm test:rls

  # ── DAG check (REAL @ F2): passes on the acyclic graph, FAILS on a seeded cycle.
  dag-check:
    name: dag-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redex
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/redex
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply academy migration(s)
        run: for f in supabase/migrations/*.sql; do psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"; done
      - name: dag:check passes on the acyclic graph
        run: pnpm dag:check
      - name: dag:check FAILS on a seeded prerequisite cycle
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "
            insert into academy.courses(id,code,title,domain,tier) values
              ('00000000-0000-0000-0000-0000000000a1','__CYC-A','A','FND','foundations'),
              ('00000000-0000-0000-0000-0000000000b1','__CYC-B','B','FND','foundations');
            insert into academy.course_prerequisites(course_id,requires_course_id) values
              ('00000000-0000-0000-0000-0000000000a1','00000000-0000-0000-0000-0000000000b1'),
              ('00000000-0000-0000-0000-0000000000b1','00000000-0000-0000-0000-0000000000a1');"
          if pnpm dag:check; then echo "::error::dag:check should FAIL on a cycle"; exit 1; fi
          echo "dag:check correctly failed on the seeded cycle ✓"

  # ── typegen drift (REAL @ F2): committed types == fresh `gen types --db-url`
  # generated off supabase/migrations/* (the schema SOURCE OF TRUTH), NOT live prod.
  # Applies the migrations to a bare postgres:16 (the SAME pattern as db-invariants /
  # rls / dag — superuser apply, so the auth-stub migration works), then introspects
  # THAT migrations-built schema via a local postgres-meta container. This decouples
  # the gate from a production deploy — a schema-adding PR is green once its migration
  # + regenerated types are committed (prod untouched), with NO SUPABASE_PROJECT_REF /
  # ACCESS_TOKEN. Mirrors dag-check: it must PASS on the migrations AND FAIL on drift.
  typegen-drift:
    name: typegen-drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redex
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # 127.0.0.1 (not localhost): the CLI rewrites a loopback --db-url host to
      # host.docker.internal for its postgres-meta container, so it reaches the
      # published service port. psql (on the runner) uses the same loopback.
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/redex
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          # do not switch back to "latest" — it resolves the newest release over the
          # network at install and the rate-limit flake fails typegen-drift (see PR #7).
          # This same CLI version's postgres-meta produced the committed types.
          version: 2.102.0
      - name: Apply academy + workos + auth migration(s) to the bare Postgres
        run: for f in supabase/migrations/*.sql; do psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Capture freshly generated types (debug/bootstrap artifact)
        if: ${{ !cancelled() }}
        # Run from a clean cwd (not the project dir) so a stray supabase/config.toml
        # is never auto-loaded — same reason infra/typegen-drift.ts gens from tmpdir.
        run: cd "$RUNNER_TEMP" && supabase gen types typescript --db-url "$SUPABASE_DB_URL" --schema academy,workos > "$RUNNER_TEMP/fresh.database.types.ts" || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: fresh-database-types
          path: ${{ runner.temp }}/fresh.database.types.ts
          retention-days: 7
      - name: typegen PASSES — committed types match a fresh gen off the migrations
        run: pnpm typegen:check
      - name: typegen FAILS on a drifted schema (negative control)
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "alter table academy.courses add column __drift_probe text;"
          if pnpm typegen:check; then echo "::error::typegen:check should FAIL on a drifted schema"; exit 1; fi
          echo "typegen:check correctly detected drift ✓"

  sanitized-fixture:
    name: sanitized-fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixture:gate

  # ── Deno type-check the /sync Edge Function (REAL @ F4). Catches a Node-only
  # import (it would fail at runtime — Edge Functions are Deno) + type errors.
  deno-check:
    name: deno-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check the /sync function + its integration test
        run: deno check --config supabase/functions/deno.json supabase/functions/sync/index.ts supabase/functions/sync/sync.integration.test.ts

  # ── /sync acceptance pipeline (REAL @ F4): the actual validate→plan→upsert path
  # run against a live Postgres — proves the F4_DRY_RUN §4 signals end-to-end
  # (idempotent double-flush, server-only rejection, immutable-after-sign via the
  # F2 trigger, LWW). The HTTP/auth wrapper + real-hardware run remain [HUMAN-VERIFY].
  sync-integration:
    name: sync-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redex
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/redex
      SYNC_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/redex
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply academy + workos + auth migration(s)
        run: for f in supabase/migrations/*.sql; do psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"; done
      - name: /sync acceptance pipeline against live Postgres
        run: deno test --allow-net --allow-env --config supabase/functions/deno.json supabase/functions/sync/sync.integration.test.ts

  # Secret scan — a live secret must never enter a tracked file (CLAUDE.md inv. §8).
  # Self-contained install (no GITLEAKS_LICENSE needed); config in .gitleaks.toml.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GL_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan repo (history + tree)
        run: gitleaks detect --source . --redact --no-banner --exit-code 1
