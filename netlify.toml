# Netlify build + hosting for the Redex Academy PWA (apps/web).
# Env values (names only — set in Netlify UI, never committed): see .env.example.
# Instant rollback is enabled by Netlify deploys (Deploys → Publish/Rollback).

[build]
  base = "."
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @redex/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--version" # no-op; pnpm (via corepack) is the package manager

# PR preview deploys: build the same way so the PWA shell loads on the preview URL.
[context.deploy-preview]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @redex/web build"

[context.branch-deploy]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @redex/web build"

# ── OB 3.0 issuer surface (did:web:redex.education) ──────────────────────────
# Netlify matches redirects TOP-TO-BOTTOM, first match wins, so these MUST precede
# the SPA catch-all below (which stays LAST). The issuer is re-hosted at the apex:
#   • /.well-known/* → the STATIC DID document + issuer Profile (apps/web/public),
#     NOT the SPA — serve the file so a verifier resolving did:web gets JSON.
#   • /credentials/* and /status/* → proxied (status=200, URL stays on
#     redex.education) to the two PUBLIC Supabase Edge Functions, so a badge
#     verifies at a public URL on the apex domain (ledger §F/§J).
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200

[[redirects]]
  from = "/credentials/*"
  to = "https://hjzxncznmerefzbowerv.supabase.co/functions/v1/hosted-assertion/:splat"
  status = 200

[[redirects]]
  from = "/status/*"
  to = "https://hjzxncznmerefzbowerv.supabase.co/functions/v1/status-list/:splat"
  status = 200

# ── SPA fallback ────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── PWA cache headers ───────────────────────────────────────────────────────
# Default for EVERY entrypoint, including SPA deep links like /catalog (Netlify
# matches headers on the REQUEST path, before the /* → /index.html rewrite, so a
# bare "/index.html" rule would miss them): the HTML must always be revalidated,
# never served stale, so the browser re-fetches index.html on each load and
# discovers the new sw.js → which fires the in-app "new version" update prompt.
# The more-specific rules below override this for their paths (hashed assets stay
# immutable; the SW is no-store). "/*" is listed FIRST so it loses to them under
# BOTH Netlify precedence models (most-specific-wins AND last-rule-in-file-wins).
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

# Service worker must NEVER be cached (F4 ships the real Workbox SW; the exact
# filename is finalized there — cover the common names now).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Hashed, content-addressed build assets — cache forever (more specific than /*).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Issuer static docs media types ───────────────────────────────────────────
# The DID document + issuer Profile are served as static files (apps/web/public/
# .well-known/) via the /.well-known/* redirect above. Give them the correct
# media types so a strict OB 3.0 / VC verifier accepts them (no .json extension on
# the issuer file). Keep them no-cache so a key rotation / profile change is picked
# up promptly (these are content, not hashed build assets).
[[headers]]
  for = "/.well-known/did.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/did+ld+json"

[[headers]]
  for = "/.well-known/issuer"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/vc+ld+json"
